# ============================================================
# QUARKUS EXTERNAL SERVICES CONFIGURATION
# ============================================================
# This file contains all external service URLs.
# Values can be overridden via environment variables:
#   - QUARKUS_HTTP_EXTERNAL_SERVICES_QDRANT_URL
#   - QUARKUS_HTTP_EXTERNAL_SERVICES_EMBEDDING_URL
#   - QUARKUS_HTTP_EXTERNAL_SERVICES_LLM_URL
#   - etc.

# ------------------------------------------------------------------
# QDRANT VECTOR DATABASE
# ------------------------------------------------------------------
quarkus.http.external-services.qdrant.url=http://qdrant
quarkus.http.external-services.qdrant.port=6334
quarkus.http.external-services.qdrant.use-tls=false

# ------------------------------------------------------------------
# EMBEDDING GENERATION SERVICE
# ------------------------------------------------------------------
quarkus.http.external-services.embedding.url=http://embedding-service
quarkus.http.external-services.embedding.port=8081

# ------------------------------------------------------------------
# LLM/CHAT COMPLETION SERVICE
# ------------------------------------------------------------------
quarkus.http.external-services.llm.url=http://llm-service
quarkus.http.external-services.llm.port=8080

# ------------------------------------------------------------------
# FEATURE FLAGS
# ------------------------------------------------------------------
# Enable/disable specific features
quarkus.http.external-services.qdrant.enabled=true
quarkus.http.external-services.embedding.enabled=true
quarkus.http.external-services.llm.enabled=true
